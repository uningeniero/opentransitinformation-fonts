# SPDX-License-Identifier: Apache-2.0
name: Font source build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family: [sign, screen]
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - id: production
        run: bash sources/build.sh --family ${{ matrix.family }}
      - if: ${{ always() && steps.production.outcome == 'success' }}
        run: python build.py validate --family ${{ matrix.family }}
      - if: ${{ always() && steps.production.outcome == 'success' }}
        run: python build.py reproduce --family ${{ matrix.family }}
      - if: ${{ always() && steps.production.outcome == 'success' }}
        run: python build.py qa --family ${{ matrix.family }}
      - name: Preserve actual production and raw QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: font-production-${{ matrix.family }}-${{ github.sha }}
          path: |
            build/production-*/
            build/qa-production-*/
          retention-days: 7
