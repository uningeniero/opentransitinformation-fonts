# SPDX-License-Identifier: Apache-2.0
name: Font source build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
      - run: python scripts/build_baselines.py --output-dir build/baselines
      - run: python scripts/build_release.py --baselines build/baselines --output-dir build/release
      - run: python scripts/validate_release.py build/release
      - run: python scripts/check_reproduction.py build/release
      - run: python scripts/check_ttx.py
      - name: Current primary QA
        shell: bash
        run: |
          tool=$(python scripts/fetch_fontspector.py)
          python scripts/run_fontspector.py --binary "$tool" --folder build/release --output-dir build/qa
