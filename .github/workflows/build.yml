# SPDX-License-Identifier: Apache-2.0
name: Font source build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock'
      - run: python scripts/build_ufo.py
      - run: python scripts/validate_ufo.py build/production-1.1.0
      - run: python scripts/check_reproduction.py build/production-1.1.0
      - name: Current primary QA
        shell: bash
        run: |
          tool=$(python scripts/fetch_fontspector.py)
          python scripts/run_fontspector.py --binary "$tool" --folder build/production-1.1.0 --output-dir build/qa-production-1.1.0
      - name: Preserve actual production and raw QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: font-production-1.1.0-${{ github.sha }}
          path: |
            build/production-1.1.0/
            build/qa-production-1.1.0/
          retention-days: 7
